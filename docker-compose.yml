version: '3.8'

services:
  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: odc-lms
    restart: unless-stopped
    mem_limit: 512m

  backend:
    build:
      context: ./server
      target: development
    container_name: backend
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env.docker
    environment:
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
    command: npm run dev
    restart: unless-stopped
    mem_limit: 512m

  frontend:
    build:
      context: ./client
      target: development
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env.docker
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped
    mem_limit: 512m

volumes:
  mongo-data:
