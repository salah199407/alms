name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # Client build (assuming frontend is in client directory)
    - name: Build client
      working-directory: ./client
      run: |
        npm ci
        npm test
        npm run build  # Assuming you have a build script

    # Server build (assuming backend is in server directory)
    - name: Build server
      working-directory: ./server
      run: |
        npm ci
        npm test

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Build and push containers
      run: |
        docker compose build
        docker compose push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /var/www/odc-lms  # Changed to match your project name
          git pull origin main
          docker compose down
          docker compose pull
          docker compose up -d --remove-orphans